tning Lane serves the walking route; do not zigzag for a return time."]};let view="Home",di=0,park="Magic Kingdom",filter="All";const V=["Home","Days","Attractions","Dining","Lightning Lane","Family","2027 Watch","Then & Now"];
function nav(){document.getElementById("nav").innerHTML=V.map(v=>`<button class="${view===v?'on':''}" onclick='view=${JSON.stringify(v)};render()'>${v}</button>`).join("")}
function card(t,b){return `<section class="card"><div class="big">${t}</div>${b}</section>`}
function home(){return `<section class="card"><div class="eyebrow">THE TRIP</div><div class="big">Beach Club-centered • Park Hopper</div><span class="tag good">9 days</span><span class="tag">Party of 6</span><span class="tag">2 major rest/pool blocks</span><p class="muted">The master Sheet remains the planning brain. This is the phone-friendly park interface.</p></section>${card("Trip at a glance",D.days.map((x,i)=>`<div class="row" onclick="di=${i};view='Days';render()"><b>${x[0]} — ${x[1]}</b><div class="small">${x[3]}</div></div>`).join(""))}<section class="card notice"><b>Public app privacy</b><p class="muted">Do not add confirmation numbers, home addresses, reservation IDs, account information or other sensitive data to this public GitHub Pages app.</p></section>`}
function day(){let x=D.days[di];return `<div class="days">${D.days.map((y,i)=>`<button class="${i===di?'on':''}" onclick="di=${i};render()">${y[0]}</button>`).join("")}</div><section class="card"><div class="eyebrow">${x[0]}</div><div class="big">${x[1]}</div><span class="tag ${x[2]==='LOCKED'?'good':'warn'}">${x[2]}</span><p class="muted">${x[3]}</p></section>${card("Full Day",x[4].map(r=>`<div class="row"><div class="time">${r[0]}</div>${r[1]}</div>`).join(""))}${card("Park Mode rule",`<div class="row"><b>NOW:</b> follow the current geographic block.</div><div class="row"><b>NEXT:</b> use the next fixed meal/show/LL return as the anchor.</div><div class="row"><b>IF BEHIND:</b> protect Must-Dos and move intentional overflow to its assigned recovery day rather than zigzagging.</div>`)}`}
function attrs(){let q=(document.getElementById("q")?.value||"").toLowerCase();let a=D.attractions[park].filter(x=>(filter==="All"||x[1]===filter)&&(!q||x.join(" ").toLowerCase().includes(q)));return `<div class="days">${Object.keys(D.attractions).map(p=>`<button class="${p===park?'on':''}" onclick='park=${JSON.stringify(p)};render()'>${p}</button>`).join("")}</div><section class="card"><input class="search" id="q" placeholder="Search ${park}…" oninput="updateA()"><div class="filters">${["All","Yes","Maybe","Adults Only","If Convenient","No"].map(f=>`<button class="${f===filter?'on':''}" onclick='filter=${JSON.stringify(f)};render()'>${f}</button>`).join("")}</div><div class="small">${a.length} matching experiences</div></section><section class="card" id="alist">${ah(a)}</section>`}
function ah(a){return a.map(x=>{let k="dw27-"+park+"-"+x[0];return `<div class="attr"><input type="checkbox" ${localStorage.getItem(k)?'checked':''} onchange="this.checked?localStorage.setItem(${JSON.stringify(k)},'1'):localStorage.removeItem(${JSON.stringify(k)})"><div><div class="name">${x[0]}</div><div class="small">${x[1]}</div></div></div>`}).join("")}
function updateA(){let q=document.getElementById("q").value.toLowerCase();document.getElementById("alist").innerHTML=ah(D.attractions[park].filter(x=>(filter==="All"||x[1]===filter)&&(!q||x.join(" ").toLowerCase().includes(q))))}
function dining(){return `<section class="card"><div class="eyebrow">LOCKED ARCHITECTURE</div><div class="big">8 TS + 8 QS per person</div><p class="muted">Most snack credits are intended for breakfast. Friday uses 1900 Park Fare instead. Credits are trip-wide, not forced daily.</p></section>${card("Meals",D.dining.map(x=>`<div class="row"><b>${x[0]} — ${x[1]}</b><div class="small">${x[2]}</div></div>`).join(""))}<section class="card notice"><b>Decision still open</b><p class="muted">Tuesday: Nonna/Nonno still choose Via Napoli or Tutto Italia. Wednesday is correctly Hollywood & Vine Fantasmic Dining Package — not Tutto Italia.</p></section>`}
function ll(){return `<section class="card"><div class="eyebrow">WORKING STRATEGY</div><div class="big">Buy LL only when it solves a real problem</div><p class="muted">Definite working LLMP days: MK #1 and HS #1. Reverify all rules for 2027.</p></section>${card("Day by day",D.ll.map(x=>`<div class="row"><b>${x[0]}</b><div class="small">${x[1]}</div></div>`).join(""))}`}
function family(){return card("Family & accessibility",D.family.map(x=>`<div class="row">${x}</div>`).join(""))}
function watch(){return card("2027 verification list",D.watch.map(x=>`<div class="row"><span class="tag warn">VERIFY</span> ${x}</div>`).join(""))}
function thennow(){return `${card("Then & Now",`<div class="row"><b>1987</b><div class="small">First Walt Disney World trip.</div></div><div class="row"><b>About 8 trips total</b><div class="small">Many in the 1990s/early 2000s; last trip 2015.</div></div><div class="row"><b>Seven Dwarfs Mine Train</b><div class="small">You saw New Fantasyland but missed Mine Train by only weeks. 2027 is the FINALLY ride.</div></div><div class="row"><b>Toy Story Mania</b><div class="small">Nostalgic repeat after the remembered ~2-hour wait; Slinky and Alien are new-to-you.</div></div><div class="row"><b>Big post-2015 worlds</b><div class="small">Galaxy’s Edge, Pandora, Remy, Runaway Railway, Moana, Guardians and more make this trip fundamentally different from 2015.</div></div>`)}`}
function render(){nav();document.getElementById("app").innerHTML=view==="Home"?home():view==="Days"?day():view==="Attractions"?attrs():view==="Dining"?dining():view==="Lightning Lane"?ll():view==="Family"?family():view==="2027 Watch"?watch():thennow();window.scrollTo(0,0)}render();</script></body></html>
