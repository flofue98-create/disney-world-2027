name: Fix Disney planner v2.1 runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-v21-ll-runtime.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Lightning Lane runtime bug
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="if(!x)return null;const r=LL_RULES[x.park];if(!r)return null,n=normName(x.name);"
          new="if(!x)return null;const r=LL_RULES[x.park];if(!r)return null;const n=normName(x.name);"
          if old not in s:
              raise SystemExit('Expected runtime-bug pattern not found; refusing to modify index.html')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,flags=re.S|re.I)
          Path('/tmp/index-scripts.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/index-scripts.js
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "Disney Planner Update"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-v21-ll-runtime.yml
          git commit -m "Fix v2.1 planner connection runtime error"
          git push
