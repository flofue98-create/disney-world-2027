name: Apply prototype v3

on:
  push:
    paths:
      - '.github/prototype-v3.payload'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode prototype
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, pathlib
          data = pathlib.Path('.github/prototype-v3.payload').read_text().strip()
          html = gzip.decompress(base64.b64decode(data))
          pathlib.Path('prototype-magic-kingdom-assistant.html').write_bytes(html)
          PY
      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          import re, pathlib
          h = pathlib.Path('prototype-magic-kingdom-assistant.html').read_text()
          m = re.search(r'<script>([\s\S]*)</script>', h)
          if not m:
              raise SystemExit('No script block found')
          pathlib.Path('/tmp/prototype-v3.js').write_text(m.group(1))
          PY
          node --check /tmp/prototype-v3.js
      - name: Commit prototype
        shell: bash
        run: |
          rm -f .github/prototype-v3.payload .github/workflows/apply-prototype-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototype-magic-kingdom-assistant.html .github/prototype-v3.payload .github/workflows/apply-prototype-v3.yml
          git commit -m "Upgrade Magic Kingdom assistant prototype interactions"
          git push
