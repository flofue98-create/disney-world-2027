name: Apply Disney planner v2.4 index

on:
  push:
    branches: [main]
    paths:
      - '.github/run-v24-2.txt'

permissions:
  contents: write

jobs:
  apply-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v2.4 patch
        shell: bash
        run: |
          cat > /tmp/v24.b64 <<'EOF'
           IQRFl8bC7R/PNXN2y9g1GO6GBoFGzDVzGIV80NDC8ZDFvquZoi19mhtgvYSH18EfmkRb40WR9Zd+IzWbHjhoSbfA1i7gHiqEaDQUSb b4Oz fykJwg cq9haUPUMVWqqDs5DXS4Df43Yd5r7Iiswnac2uFWgtJM+Ybh1UWUzZG2LgQUcxu4fba w24LxcrJN0yxNgN5IYGB3NbwH5uGlDtHEkI70JIi43QIQx6qf7pj4DtSz7wdgq/XXURQwGhqi+xKgrEumH2/AyIPKLaBjCCmh6w7EH7BOMCDBmSACRrD7gyhh4bnqBsB971FAg3hpt8H1ZAxAP5Th00uNDXRTfqotVimsZh06wmu jEY6DYEXJMI R8F4Oxx1mkfBO9H7njRNzbOCSvCaKDjVrYdcdxDFYflK3XtmSDMD/LDlg2ZAt...TRUNCATED_FOR_SAFETY...
          EOF
          tr -d ' \n\r\t' < /tmp/v24.b64 | base64 -d | gunzip > /tmp/v24.patch
          git apply --check /tmp/v24.patch
          git apply /tmp/v24.patch
      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,flags=re.S|re.I)
          Path('/tmp/index-scripts.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/index-scripts.js
      - name: Commit updated index
        shell: bash
        run: |
          git config user.name "Disney Planner Update"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git rm .github/run-v24.txt || true
          git rm .github/run-v24-2.txt
          git rm .github/workflows/apply-v24-index.yml
          git commit -m "Make Disney planner itinerary placement intuitive"
          git push
