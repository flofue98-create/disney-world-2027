name: Apply Disney planner v2.4 index

on:
  push:
    branches: [main]
    paths:
      - '.github/v24b64/**'

permissions:
  contents: write

jobs:
  apply-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check compressed patch parts
        id: parts
        shell: bash
        run: |
          count=$(find .github/v24b64 -maxdepth 1 -name 'part*.b64' 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" = "2" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; fi
      - name: Apply v2.4 patch
        if: steps.parts.outputs.ready == 'true'
        shell: bash
        run: |
          cat $(find .github/v24b64 -maxdepth 1 -name 'part*.b64' | sort) | base64 -d | gunzip > /tmp/v24.patch
          git apply --check /tmp/v24.patch
          git apply /tmp/v24.patch
      - name: Validate JavaScript
        if: steps.parts.outputs.ready == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,flags=re.S|re.I)
          Path('/tmp/index-scripts.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/index-scripts.js
      - name: Commit updated index
        if: steps.parts.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name "Disney Planner Update"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git rm -r .github/v24b64
          git rm .github/run-v24.txt || true
          git rm .github/workflows/apply-v24-index.yml
          git commit -m "Make Disney planner itinerary placement intuitive"
          git push
