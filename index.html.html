<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Disney World 2027</title>
<style>
*{box-sizing:border-box}
:root{
 --bg:#f6f3ee;--card:#fff;--ink:#1f2933;--muted:#667085;--blue:#174f86;--line:#e5e7eb;
 --ll:#fff5cf;--ll2:#ffe08a;--show:#eaf4ff;--meal:#f4ecff;--done:#edf8ef;--skip:#f3f4f6;--accent:#20364d;
}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-bottom:1px solid #ddd;padding:14px 14px 11px}
.brand{font-size:24px;font-weight:850}.sub{font-size:12px;color:var(--muted);margin-top:3px}
.nav{display:flex;gap:8px;overflow:auto;padding-top:11px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}
.nav button{border:1px solid #ccd3dc;background:#fff;border-radius:999px;padding:8px 12px;color:var(--blue);font-weight:750;white-space:nowrap}
.nav button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
main{max-width:820px;margin:auto;padding:13px 13px 80px}
.screen{display:none}.screen.active{display:block}
.daytabs{display:flex;gap:7px;overflow:auto;margin-bottom:11px;scrollbar-width:none}.daytabs::-webkit-scrollbar{display:none}
.daytabs button{border:1px solid #d6dbe1;background:#fff;border-radius:13px;padding:9px 11px;white-space:nowrap;font-weight:750}
.daytabs button.active{background:#1f2933;color:#fff;border-color:#1f2933}
.hero,.block,.info,.nextbox{background:#fff;border:1px solid #ddd;border-radius:18px;padding:15px;margin-bottom:11px}
.hero h1{font-size:26px;margin:0 0 3px;line-height:1.12}.muted{color:var(--muted)}
.hours{margin-top:8px;font-size:13px;font-weight:700}
.heroactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mapbtn{display:inline-block;border:1px solid #ccd3dc;background:#fff;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:800;color:var(--blue);text-decoration:none}
.progress{height:8px;background:#e9edf2;border-radius:999px;overflow:hidden;margin-top:10px}.bar{height:100%;background:#1f2933;width:0}
.nextbox{border:2px solid #20364d}.nextlabel{text-transform:uppercase;letter-spacing:.08em;font-size:10px;font-weight:900;color:var(--blue)}
.nextname{font-size:18px;font-weight:850;margin-top:4px}.nextmeta{font-size:12px;color:var(--muted);margin-top:3px}
.block{padding:0;overflow:hidden}
.blockhead{padding:14px 14px 10px;background:#fcfcfc;border-bottom:1px solid var(--line)}
.block h2{font-size:18px;margin:2px 0 0}.blocktime{font-size:11px;font-weight:900;color:var(--blue);text-transform:uppercase;letter-spacing:.04em}
.item{position:relative;border-top:1px solid var(--line);padding:13px 12px 13px 43px;min-height:54px;background:#fff}
.item:first-child{border-top:0}.item.done{background:var(--done);opacity:.72}.item.skipped{background:var(--skip);opacity:.52}.item.later{border-left:4px solid #9aa7b4}
.item.llcard{background:linear-gradient(90deg,var(--ll),#fff 72%)}.item.priority{background:linear-gradient(90deg,var(--ll2),#fff 78%)}
.check{position:absolute;left:12px;top:15px;width:22px;height:22px}
.name{font-weight:830;line-height:1.22}.time{font-size:12px;font-weight:850;color:var(--blue);margin-bottom:2px}.meta{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
.badges{margin-top:5px}.badge{display:inline-block;border-radius:999px;padding:3px 7px;font-size:10px;font-weight:900;margin:2px 4px 0 0}
.b-ll{background:var(--ll)}.b-priority{background:var(--ll2)}.b-show{background:var(--show)}.b-meal{background:var(--meal)}
details{margin-top:6px}.more{font-size:11px;color:var(--blue);font-weight:800;cursor:pointer}
.detailtext{font-size:12px;color:var(--muted);line-height:1.45;padding:7px 0 2px}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.actions button{border:1px solid #ccd3dc;background:#fff;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:800;color:var(--blue)}
.legend{font-size:10px;color:var(--muted);display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.legend span{padding:3px 7px;border-radius:999px}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
.reservation{background:#fff;border:1px solid #ddd;border-radius:16px;padding:14px}.reservation b{display:block}.reservation .small{font-size:12px;color:var(--muted);margin-top:4px}
.tripstamp{font-size:11px;color:var(--muted);margin-top:10px}
@media(min-width:650px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>

function key(di,bi,ii){return `dw27_${di}_${bi}_${ii}`}
function state(k){return localStorage.getItem(k)||""}
function setState(k,v){localStorage.setItem(k,v);renderDay(currentDay);updateTrip()}
let currentDay=0;

function renderTabs(){
 daytabs.innerHTML=days.map((x,i)=>`<button class="${i===currentDay?'active':''}" onclick="currentDay=${i};renderTabs();renderDay(${i})">${x.d}</button>`).join("")
}
function itemClass(x,s){
 let c="";
 if(s==="done") c+=" done";
 if(s==="later") c+=" later";
 if(s==="skip") c+=" skipped";
 if(x.ll==="Lightning Lane priority") c+=" priority";
 else if(x.ll) c+=" llcard";
 return c;
}
function badges(x){
 let out="";
 if(x.ll==="Lightning Lane priority") out+=`<span class="badge b-priority">Lightning Lane priority</span>`;
 else if(x.ll) out+=`<span class="badge b-ll">${x.ll}</span>`;
 if(x.kind==="show") out+=`<span class="badge b-show">Show / entertainment</span>`;
 if(x.kind==="meal") out+=`<span class="badge b-meal">Dining / reservation</span>`;
 return out?`<div class="badges">${out}</div>`:"";
}
function renderDay(di){
 const d=days[di]; let total=0,done=0,nextObj=null;
 d.blocks.forEach((b,bi)=>b.items.forEach((x,ii)=>{
  total++; const s=state(key(di,bi,ii)); if(s==="done")done++;
  if(!nextObj && !s) nextObj={x,b};
 }));
 const pct=total?done/total*100:0;
 let h=`<div class="hero">
   <h1>${d.title}</h1><div class="muted">${d.d}</div>
   <div class="hours">${d.hours}</div>
   <div class="progress"><div class="bar" style="width:${pct}%"></div></div>
   <div class="muted" style="margin-top:7px">${done} of ${total} completed</div>
   <div class="heroactions">${maps[d.park]?`<a class="mapbtn" href="${maps[d.park]}" target="_blank" rel="noopener">Open ${d.park} Map</a>`:""}</div>
   <div class="legend"><span class="b-priority">Lightning Lane priority</span><span class="b-ll">Lightning Lane</span><span class="b-show">Show</span><span class="b-meal">Dining</span></div>
 </div>`;
 if(nextObj){
  h+=`<div class="nextbox"><div class="nextlabel">Up Next</div><div class="nextname">${nextObj.x.name}</div><div class="nextmeta">${nextObj.b.t} • ${nextObj.b.area}</div></div>`;
 }
 d.blocks.forEach((b,bi)=>{
   h+=`<div class="block"><div class="blockhead"><div class="blocktime">${b.t}</div><h2>${b.area}</h2></div>`;
   b.items.forEach((x,ii)=>{
    const k=key(di,bi,ii),s=state(k);
    const extra=(x.details||true)?`<details><summary class="more">More</summary><div class="detailtext">${x.details||"Mark this complete, move it later, or skip it for today."}<div class="actions"><button onclick="setState('${k}','later')">Later</button><button onclick="setState('${k}','skip')">Skip</button><button onclick="setState('${k}','')">Reset</button></div></div></details>`:"";
    h+=`<div class="item${itemClass(x,s)}">
      <input class="check" type="checkbox" ${s==="done"?"checked":""} onchange="setState('${k}',this.checked?'done':'')">
      ${x.time?`<div class="time">${x.time}</div>`:""}
      <div class="name">${x.name}</div>
      ${x.meta?`<div class="meta">${x.meta}</div>`:""}
      ${badges(x)}
      ${extra}
    </div>`;
   });
   h+=`</div>`;
 });
 day.innerHTML=h;
}
function updateTrip(){
 let total=0,done=0;
 days.forEach((d,di)=>d.blocks.forEach((b,bi)=>b.items.forEach((x,ii)=>{total++;if(state(key(di,bi,ii))==="done")done++})));
 tripbar.style.width=(total?done/total*100:0)+"%";
 tripprogress.textContent=`${done} of ${total} itinerary items completed`;
}
function renderDining(){
 let rows=[];
 days.forEach(d=>d.blocks.forEach(b=>b.items.filter(x=>x.kind==="meal").forEach(x=>rows.push(`<div class="reservation"><b>${x.name}</b><div class="small">${d.d} • ${x.time||b.t}${x.meta?" • "+x.meta:""}</div></div>`))));
 dininglist.innerHTML=rows.join("");
}
function renderMaps(){
 maplist.innerHTML=Object.entries(maps).map(([n,u])=>`<div class="reservation"><b>${n}</b><a class="mapbtn" href="${u}" target="_blank" rel="noopener">Open Map</a></div>`).join("");
}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{
 document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");
 document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(b.dataset.screen).classList.add("active");
});
renderTabs();renderDay(0);renderDining();renderMaps();updateTrip();
</script>
</body>
</html>
