<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Disney World 2027</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f5f2ec;--card:#fff;--ink:#1f2933;--muted:#667085;--blue:#174f86;--line:#e6e6e6;--ll:#fff3c4;--ll2:#ffe08a;--show:#edf5ff;--meal:#f5edff;--done:#eef8ef}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #ddd;padding:16px}
.brand{font-size:25px;font-weight:850}.sub{font-size:12px;color:var(--muted);margin-top:3px}
.nav{display:flex;gap:8px;overflow:auto;padding-top:12px}
.nav button{border:1px solid #ccd3dc;background:#fff;border-radius:999px;padding:8px 12px;color:var(--blue);font-weight:750;white-space:nowrap}
.nav button.active{background:var(--blue);color:#fff}
main{max-width:780px;margin:auto;padding:14px 14px 80px}
.screen{display:none}.screen.active{display:block}
.daytabs{display:flex;gap:8px;overflow:auto;margin-bottom:12px}
.daytabs button{border:1px solid #d6dbe1;background:#fff;border-radius:14px;padding:9px 11px;white-space:nowrap;font-weight:700}
.daytabs button.active{background:#1f2933;color:#fff}
.hero,.block,.info{background:#fff;border:1px solid #ddd;border-radius:18px;padding:15px;margin-bottom:12px}
.hero h1{font-size:27px;margin:0 0 4px}.muted{color:var(--muted)}
.progress{height:8px;background:#e9edf2;border-radius:999px;overflow:hidden;margin-top:10px}.bar{height:100%;background:#1f2933;width:0}
.block h2{font-size:18px;margin:0 0 4px}.blocktime{font-size:12px;font-weight:800;color:var(--blue);margin-bottom:9px}
.item{position:relative;border-top:1px solid var(--line);padding:11px 4px 11px 36px;min-height:46px}
.item:first-of-type{border-top:0}.item.done{background:var(--done);opacity:.72}
.check{position:absolute;left:3px;top:12px;width:23px;height:23px}
.name{font-weight:780}.meta{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.35}
.badge{display:inline-block;border-radius:999px;padding:3px 7px;font-size:10px;font-weight:850;margin:3px 4px 0 0}
.ll{background:var(--ll)}.lltop{background:var(--ll2)}.show{background:var(--show)}.meal{background:var(--meal)}
.actions{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}.actions button,.mapbtn{border:1px solid #ccd3dc;background:#fff;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:750;color:var(--blue);text-decoration:none}
.later{border-left:4px solid #a7b4c3}.skipped{opacity:.45}
.next{border:2px solid #1f2933}
.mapbtn{display:inline-block;margin-top:8px}
.legend{font-size:11px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.legend span{padding:3px 7px;border-radius:999px}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
.reservation{background:#fff;border:1px solid #ddd;border-radius:16px;padding:14px}
.reservation b{display:block}
@media(min-width:650px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
 <div class="brand">Disney World 2027</div>
 <div class="sub">August 21–29, 2027 • Beach Club</div>
 <div class="nav">
  <button class="active" data-screen="today">Daily Itinerary</button>
  <button data-screen="dining">Dining</button>
  <button data-screen="maps">Maps</button>
  <button data-screen="trip">Trip</button>
 </div>
</header>
<main>
<section id="today" class="screen active">
 <div class="daytabs" id="daytabs"></div>
 <div id="day"></div>
</section>
<section id="dining" class="screen"><div class="hero"><h1>Dining</h1><div class="muted">Reservations and meals for the trip</div></div><div class="grid" id="dininglist"></div></section>
<section id="maps" class="screen"><div class="hero"><h1>Maps</h1><div class="muted">Park maps in one place</div></div><div class="grid" id="maplist"></div></section>
<section id="trip" class="screen"><div class="hero"><h1>Trip</h1><p><b>August 21–29, 2027</b></p><p>Disney’s Beach Club Resort • Park Hopper tickets</p></div><div class="info"><b>Trip progress</b><div class="progress"><div class="bar" id="tripbar"></div></div><div class="muted" id="tripprogress" style="margin-top:7px"></div></div></section>
</main>

function key(di,bi,ii){return `dw27_${di}_${bi}_${ii}`}
function state(k){return localStorage.getItem(k)||""}
function setState(k,v){localStorage.setItem(k,v);renderDay(currentDay);updateTrip()}
let currentDay=0;

function renderTabs(){
 daytabs.innerHTML=days.map((x,i)=>`<button class="${i===currentDay?'active':''}" onclick="currentDay=${i};renderTabs();renderDay(${i})">${x.d}</button>`).join("")
}
function renderDay(di){
 const d=days[di]; let total=0,done=0;
 d.blocks.forEach((b,bi)=>b.items.forEach((x,ii)=>{total++;if(state(key(di,bi,ii))==="done")done++}));
 const pct=total?done/total*100:0;
 let h=`<div class="hero"><h1>${d.title}</h1><div class="muted">${d.d}</div><div class="progress"><div class="bar" style="width:${pct}%"></div></div><div class="muted" style="margin-top:7px">${done} of ${total} completed</div><div class="legend"><span class="lltop">Lightning Lane priority</span><span class="ll">Lightning Lane</span><span class="show">Show / entertainment</span><span class="meal">Dining / reservation</span></div></div>`;
 let nextMarked=false;
 d.blocks.forEach((b,bi)=>{
   h+=`<div class="block"><div class="blocktime">${b.t}</div><h2>${b.area}</h2>`;
   b.items.forEach((x,ii)=>{
    const k=key(di,bi,ii),s=state(k), cls=s==="done"?"done":s==="later"?"later":s==="skip"?"skipped":"";
    let next="";
    if(!nextMarked && !s){next=" next";nextMarked=true}
    const badge=x.tag?`<span class="badge ${x.kind==='lltop'?'lltop':x.kind==='ll'?'ll':x.kind==='show'?'show':'meal'}">${x.tag}</span>`:"";
    h+=`<div class="item ${cls}${next}"><input class="check" type="checkbox" ${s==="done"?"checked":""} onchange="setState('${k}',this.checked?'done':'')"><div class="name">${x.name}</div>${x.meta?`<div class="meta">${x.meta}</div>`:""}${badge}<div class="actions"><button onclick="setState('${k}','later')">Later</button><button onclick="setState('${k}','skip')">Skip</button><button onclick="setState('${k}','')">Reset</button></div></div>`;
   });
   if(maps[d.park]) h+=`<a class="mapbtn" href="${maps[d.park]}" target="_blank" rel="noopener">Open ${d.park} Map</a>`;
   h+=`</div>`;
 });
 day.innerHTML=h;
}
function updateTrip(){
 let total=0,done=0;
 days.forEach((d,di)=>d.blocks.forEach((b,bi)=>b.items.forEach((x,ii)=>{total++;if(state(key(di,bi,ii))==="done")done++})));
 tripbar.style.width=(total?done/total*100:0)+"%";tripprogress.textContent=`${done} of ${total} itinerary items completed`;
}
function renderDining(){
 let rows=[];
 days.forEach(d=>d.blocks.forEach(b=>b.items.filter(x=>x.kind==="meal").forEach(x=>rows.push(`<div class="reservation"><b>${x.name}</b><div class="muted">${d.d} • ${b.t}${x.meta?" • "+x.meta:""}</div></div>`))));
 dininglist.innerHTML=rows.join("");
}
function renderMaps(){
 maplist.innerHTML=Object.entries(maps).map(([n,u])=>`<div class="reservation"><b>${n}</b><a class="mapbtn" href="${u}" target="_blank" rel="noopener">Open Map</a></div>`).join("");
}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{
 document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");
 document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(b.dataset.screen).classList.add("active");
});
renderTabs();renderDay(0);renderDining();renderMaps();updateTrip();
</script>
</body></html>
