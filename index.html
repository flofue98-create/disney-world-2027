function locationFor(p,n){return (LOCATIONS[p]&&LOCATIONS[p][n])||p}

const MAPS={
  "Magic Kingdom":"https://cdn1.parksmedia.wdprapps.disney.com/vision-dam/digital/parks-platform/parks-global-assets/disney-world/guest-services/guide-maps/MK_0626_EN-DIGITAL.pdf?2026-06-23T16:48:45+00:00",
  "EPCOT":"https://cdn1.parksmedia.wdprapps.disney.com/vision-dam/digital/parks-platform/parks-global-assets/disney-world/guest-services/guide-maps/EPCOT-guidemap_0726_ENG-DIGITAL.pdf?2026-06-12T14:25:45+00:00",
  "Hollywood Studios":"https://cdn1.parksmedia.wdprapps.disney.com/vision-dam/digital/parks-platform/parks-global-assets/disney-world/guest-services/guide-maps/DHS_052626_EN-KM.pdf?2026-05-12T14:18:43+00:00",
  "Animal Kingdom":"https://cdn1.parksmedia.wdprapps.disney.com/vision-dam/digital/parks-platform/parks-global-assets/disney-world/guest-services/guide-maps/DAK_0526_ENG_DIGITAL.pdf?2026-05-13T17:38:10+00:00"
};

let view="Home",di=0,park="Magic Kingdom",filter="All",remainingOnly=false;
const V=["Home","Days","Attractions","Maps","Dining","Lightning Lane","Family","2027 Watch","Then & Now"];

function nav(){
  document.getElementById("nav").innerHTML=V.map(v =>
    `<button class="${view===v?'on':''}" data-view="${esc(v)}">${v}</button>`
  ).join("");
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function card(t,b){return `<section class="card"><div class="big">${t}</div>${b}</section>`}

function home(){
  return `<section class="card"><div class="eyebrow">THE TRIP</div><div class="big">Beach Club-centered • Park Hopper</div>
  <span class="tag good">9 days</span><span class="tag">Party of 6</span><span class="tag">2 major rest/pool blocks</span>
  <p class="muted">Your phone-friendly Walt Disney World trip guide.</p></section>
  ${card("Trip at a glance",D.days.map((x,i)=>`<div class="row clickable" data-day="${i}"><b>${x[0]} — ${x[1]}</b><div class="small">${x[3]}</div></div>`).join(""))}`;
}


function statusFor(p,n){
  const row=(D.attractions[p]||[]).find(x=>x[0]===n);
  return row?row[1]:"";
}
function blockAttractions(dayIndex,blockIndex){
  const items=(DAY_ATTRACTIONS[dayIndex]&&DAY_ATTRACTIONS[dayIndex][blockIndex])||[];
  if(!items.length)return "";
  let lastGroup="";
  let body="";
  items.forEach(([p,n])=>{
    const checked=isDone(p,n);
    const status=statusFor(p,n);
    const group=locationFor(p,n);
    if(group!==lastGroup){
      body+=`<div class="blockgroup">${group}</div>`;
      lastGroup=group;
    }
    body+=`<label class="dayattr ${checked?'done':''}">
      <input type="checkbox" data-attraction="${esc(n)}" data-attraction-park="${esc(p)}" ${checked?'checked':''}>
      <div><div class="dayattrname">${n}</div><div class="dayattrstatus">${status}</div></div>
    </label>`;
  });
  return `<div class="blockattrs"><div class="blocktitle">Experiences in this block</div>
    <div class="blockhint">Grouped by park area so you can follow the route more easily.</div>${body}</div>`;
}
function day(){
  let x=D.days[di];
  return `<div class="days">${D.days.map((y,i)=>`<button class="${i===di?'on':''}" data-day="${i}">${y[0]}</button>`).join("")}</div>
  <section class="card"><div class="eyebrow">${x[0]}</div><div class="big">${x[1]}</div>
  <p class="muted">${x[3]}</p></section>
  ${card("Full Day",x[4].map((r,bi)=>`<div class="row"><div class="time">${r[0]}</div>${r[1]}${blockAttractions(di,bi)}</div>`).join(""))}`;
}

function plannedList(p){return D.attractions[p].filter(x=>x[1]!=="No")}
function keyFor(p,n){return "dw27-"+p+"-"+n}
function isDone(p,n){return !!localStorage.getItem(keyFor(p,n))}
function progressFor(p){
  const planned=plannedList(p);
  const done=planned.filter(x=>isDone(p,x[0])).length;
  return {done,total:planned.length,pct:planned.length?Math.round(done/planned.length*100):0};
}
function filteredAttractions(){
  let q=(document.getElementById("q")?.value||"").toLowerCase();
  return D.attractions[park].filter(x=>{
    const statusOk=filter==="All"||x[1]===filter;
    const searchOk=!q||x.join(" ").toLowerCase().includes(q);
    const remainingOk=!remainingOnly||!isDone(park,x[0]);
    return statusOk&&searchOk&&remainingOk;
  });
}
function attrs(){
  const a=filteredAttractions();
  const p=progressFor(park);
  return `<div class="days">${Object.keys(D.attractions).map(pn=>`<button class="${pn===park?'on':''}" data-park="${esc(pn)}">${pn}</button>`).join("")}</div>
  <section class="card">
    <div class="progressline"><b>${p.done} of ${p.total} planned experiences completed</b><span class="small">${p.pct}%</span></div>
    <div class="progressbar"><div class="progressfill" style="width:${p.pct}%"></div></div>
    <div class="actionrow">
      <button class="actionbtn ${remainingOnly?'on':''}" data-action="remaining">${remainingOnly?'Showing Remaining':'Show Remaining Only'}</button>
      <button class="actionbtn" data-action="open-map">Official ${park} Map</button>
      <button class="actionbtn danger" data-action="reset-park">Reset ${park} Progress</button>
    </div>
  </section>
  <section class="card"><input class="search" id="q" placeholder="Search ${park}…">
    <div class="filters">${["All","Yes","Maybe","Adults Only","If Convenient","No"].map(f=>`<button class="${f===filter?'on':''}" data-filter="${esc(f)}">${f}</button>`).join("")}</div>
    <div class="small" id="matchcount">${a.length} matching experiences</div>
  </section>
  <section class="card" id="alist">${ah(a)}</section>`;
}
function ah(a){
  return a.map(x=>{
    const checked=isDone(park,x[0]);
    return `<label class="attr ${checked?'done':''}">
      <input type="checkbox" data-attraction="${esc(x[0])}" ${checked?'checked':''}>
      <div><div class="name">${x[0]}</div><div class="small">${x[1]}</div></div>
    </label>`;
  }).join("");
}
function updateA(){
  const alist=document.getElementById("alist");
  if(!alist)return;
  const a=filteredAttractions();
  alist.innerHTML=ah(a);
  const mc=document.getElementById("matchcount");
  if(mc)mc.textContent=`${a.length} matching experiences`;
}

function mapsView(){
  const url=MAPS[park];
  return `<div class="days">${Object.keys(MAPS).map(pn=>`<button class="${pn===park?'on':''}" data-mappark="${esc(pn)}">${pn}</button>`).join("")}</div>
  <section class="card">
    <div class="eyebrow">OFFICIAL DISNEY GUIDE MAP</div>
    <div class="big">${park}</div>
    <iframe class="mapframe" src="${url}" title="Official ${park} guide map"></iframe>
  </section>`;
}

function dining(){
  return `<section class="card"><div class="eyebrow">DINING PLAN</div><div class="big">8 Table-Service + 8 Quick-Service per person</div>
  <p class="muted">Most snack credits are intended for breakfast. Friday uses 1900 Park Fare instead. Credits are trip-wide, not forced daily.</p></section>
  ${card("Meals",D.dining.map(x=>`<div class="row"><b>${x[0]} — ${x[1]}</b><div class="small">${x[2]}</div></div>`).join(""))}
  <section class="card notice"><b>Decision still open</b><p class="muted">Tuesday: Nonna and Nonno still choose Via Napoli or Tutto Italia. Wednesday is Hollywood & Vine Fantasmic Dining Package.</p></section>`;
}
function lightning(){
  return `<section class="card"><div class="eyebrow">WORKING STRATEGY</div><div class="big">Buy Lightning Lane only when it solves a real problem</div>
  <p class="muted">Definite working Lightning Lane Multi Pass days: Magic Kingdom First Day and Disney’s Hollywood Studios First Day. Reverify all rules for 2027.</p></section>
  ${card("Day by day",D.ll.map(x=>`<div class="row"><b>${x[0]}</b><div class="small">${x[1]}</div></div>`).join(""))}`;
}
function family(){return card("Family & accessibility",D.family.map(x=>`<div class="row">${x}</div>`).join(""))}
function watch(){return card("2027 verification list",D.watch.map(x=>`<div class="row"><span class="tag warn">VERIFY</span> ${x}</div>`).join(""))}
function thennow(){return card("Then & Now",`<div class="row"><b>1987</b><div class="small">First Walt Disney World trip.</div></div>
<div class="row"><b>About 8 trips total</b><div class="small">Many in the 1990s and early 2000s; last trip 2015.</div></div>
<div class="row"><b>Seven Dwarfs Mine Train</b><div class="small">You saw New Fantasyland but missed Mine Train by only weeks. 2027 is the finally-get-to-ride-it trip.</div></div>
<div class="row"><b>Toy Story Mania</b><div class="small">Nostalgic repeat after the remembered nearly two-hour wait; Slinky Dog Dash and Alien Swirling Saucers are new to you.</div></div>
<div class="row"><b>Big post-2015 worlds</b><div class="small">Galaxy’s Edge, Pandora, Remy, Runaway Railway, Journey of Water, Guardians and more make this trip fundamentally different from 2015.</div></div>`)}

function render(){
  nav();
  const app=document.getElementById("app");
  app.innerHTML=view==="Home"?home():
    view==="Days"?day():
    view==="Attractions"?attrs():
    view==="Maps"?mapsView():
    view==="Dining"?dining():
    view==="Lightning Lane"?lightning():
    view==="Family"?family():
    view==="2027 Watch"?watch():thennow();
  window.scrollTo(0,0);
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-day]");
  if(!b)return;

  if(b.dataset.view){view=b.dataset.view;render();return}
  if(b.dataset.day!==undefined){di=Number(b.dataset.day);view="Days";render();return}
  if(b.dataset.park){park=b.dataset.park;remainingOnly=false;render();return}
  if(b.dataset.mappark){park=b.dataset.mappark;render();return}
  if(b.dataset.filter){filter=b.dataset.filter;render();return}

  if(b.dataset.action==="remaining"){remainingOnly=!remainingOnly;render();return}
  if(b.dataset.action==="open-map"){view="Maps";render();return}
  if(b.dataset.action==="reset-park"){
    if(confirm(`Reset all completed checkmarks for ${park}?`)){
      D.attractions[park].forEach(x=>localStorage.removeItem(keyFor(park,x[0])));
      render();
    }
  }
});

document.addEventListener("input",e=>{
  if(e.target.id==="q")updateA();
});

document.addEventListener("change",e=>{
  if(!e.target.matches('input[type="checkbox"][data-attraction]'))return;
  const name=e.target.dataset.attraction;
  const checkboxPark=e.target.dataset.attractionPark||park;
  if(e.target.checked)localStorage.setItem(keyFor(checkboxPark,name),"1");
  else localStorage.removeItem(keyFor(checkboxPark,name));
  render();
});

render();
</script></body></html>
